<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Passcode</title>
<style>
  :root {
    color-scheme: dark;
    font-family: "Helvetica Neue", Arial, sans-serif;
    color: #eae2d6;
    background: #111216;
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  .phone {
    position: relative; color: white;
    isolation: isolate;
    background:
      radial-gradient(ellipse at 92% 18%, #555d70 0%, transparent 48%),
      radial-gradient(ellipse at 12% 74%, #62432e 0%, transparent 55%),
      #111216;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 24px;
    padding: max(24px, env(safe-area-inset-top))
      max(24px, env(safe-area-inset-right))
      max(24px, env(safe-area-inset-bottom))
      max(24px, env(safe-area-inset-left));
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(24px, 7.5dvh, 76px);
  }
  .phone::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background: linear-gradient(151deg, #fff3, #fff1 25%, transparent 44%, #fff0 76%, #c0cdff21);
  }
  .prompt { text-align: center; }
  h1 { font-size: 1.375rem; font-weight: 500; margin: 0 0 clamp(20px, 5.5dvh, 58px); }
  .dots { display: flex; gap: clamp(20px, 5.5vw, 28px); justify-content: center; }
  .dot { width: 12px; height: 12px; border: 1px solid #fff; border-radius: 50%; }
  .dot.filled { background: #fff; }
  .status {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, clamp(52px, min(20vw, 9.5dvh), 96px)));
    justify-content: center;
    gap: clamp(10px, 2.1dvh, 22px) clamp(14px, 5.5vw, 27px);
    width: 100%;
  }
  .keypad .action { grid-row: 5; margin-top: clamp(12px, 7dvh, 70px); }
  .keypad #reset { grid-column: 1; }
  .keypad #backspace { grid-column: 3; }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  button:focus-visible { outline: 2px solid white; outline-offset: 3px; }
  .key {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    aspect-ratio: 1; border: 1px solid #ffffff29; border-radius: 50%;
    background-color: #e7d7c326;
    background-image: radial-gradient(ellipse at 32% 4%, #ffffff2b, transparent 66%);
    box-shadow: inset 0 1px 2px #ffffff30, inset 0 -2px 5px #0003, 0 3px 9px #0004;
    text-shadow: 0 1px 2px #0007;
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
  }
  @media (hover: hover) {
    .key:hover { background-color: #e7d7c33d; }
  }
  .key, .action {
    position: relative;
    --key-release-easing: linear(0, .52 16%, 1.28 39%, .93 65%, 1.02 84%, 1);
    -webkit-tap-highlight-color: transparent;
    transition: background-color 210ms ease-out;
  }
  .key-light {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background: radial-gradient(circle at var(--light-x, 50%) var(--light-y, 45%),
      #fff9, #dce8ff38 28%, transparent 68%);
    box-shadow: inset 0 0 0 1px #ecf2ff88, inset 0 1px 8px #fff4;
    opacity: 0;
    transition: opacity 300ms ease-out;
  }
  :is(.key, .action):active > .key-light {
    opacity: 1;
    transition-duration: 0ms;
  }
  .key:active, .action:active { transition-duration: 0ms; }
  .key:active { background-color: #ffffff59; }
  .action:active { background: #ffffff26; }
  .action { border-radius: 18px; }
  @media (prefers-reduced-motion: no-preference) {
    .phone:not([hidden]) > :is(.prompt, .keypad) {
      animation: passcode-enter 480ms cubic-bezier(.25, .7, .35, 1) backwards;
    }
    .phone:not([hidden]) > .keypad { animation-delay: 45ms; }
    .key, .action {
      transition: background-color 210ms ease-out, transform 380ms var(--key-release-easing);
    }
    .key:active, .action:active { transform: scale(.88); transition-duration: 0ms; }
  }
  @keyframes passcode-enter {
    0% { opacity: 0; transform: translateY(22px) scale(.94); }
    55% { opacity: 1; transform: translateY(-5px) scale(1.025); }
    80% { transform: translateY(2px) scale(.993); }
    100% { opacity: 1; transform: none; }
  }
  .digit { font-size: 1.7rem; line-height: 1; font-weight: 400; }
  .letters { font-size: .625rem; font-weight: 700; letter-spacing: .14em; margin-top: 4px; }
  .zero { grid-column: 2; }
  .action { border: 0; background: none; font-size: .8125rem; min-height: 44px; padding: 0; }
  .action:hover { text-decoration: underline; }
  .backspace { font-size: 1.35rem; }
  .haptics-check { max-width: 32ch; text-align: center; }
  .haptics-check button { min-height: 44px; padding: 0 14px; }
  .haptics-check output { display: block; margin-top: 8px; font-size: .875rem; }
  .phone[hidden], .home-screen[hidden] { display: none; }
  .home-screen {
    position: relative;
    display: grid;
    place-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    background: #111216;
  }
  .unlocked-title { margin: 0; color: white; font-size: 2rem; }
  .home-screen { overflow: hidden; }
  @media (prefers-reduced-motion: no-preference) {
    .home-screen:not([hidden]) .unlocked-title {
      animation: unlock-reveal 560ms cubic-bezier(.22, .7, .3, 1) both;
    }
    .home-screen:not([hidden]) .home-replay {
      animation: replay-appear 180ms ease-out 380ms backwards;
    }
  }
  @keyframes unlock-reveal {
    0% { opacity: 0; transform: translateY(18px) scale(1.13); filter: blur(9px); }
    66% { opacity: 1; transform: translateY(-2px) scale(.993); filter: blur(0); }
    100% { opacity: 1; transform: none; filter: none; }
  }
  @keyframes replay-appear {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .home-replay {
    position: absolute;
    bottom: max(12px, env(safe-area-inset-bottom));
    right: max(12px, env(safe-area-inset-right));
    min-height: 44px;
    padding: 0 14px;
    border: 1px solid #fff4;
    border-radius: 22px;
    background: #111216e6;
    color: white;
  }
  .sharing-dot {
    position: fixed;
    z-index: 2;
    right: max(10px, env(safe-area-inset-right));
    bottom: max(10px, env(safe-area-inset-bottom));
    width: 44px;
    height: 44px;
    border: 0;
    border-radius: 50%;
    background: #111216bb;
  }
  .sharing-dot::after {
    content: "";
    display: block;
    width: 10px;
    height: 10px;
    margin: auto;
    border-radius: 50%;
    background: #7df0bb;
  }
  .peek-dialog {
    width: min(360px, 90vw);
    padding: 20px;
    color: white;
    background: #20212a;
    border: 1px solid #fff4;
    border-radius: 20px;
  }
  .peek-dialog::backdrop { background: #0009; }
  .peek-dialog input, .peek-dialog button { min-height: 44px; }
  .peek-dialog output { display: block; margin: 12px 0; }
  .peek-taps { font-size: 1.5rem; overflow-wrap: anywhere; }
  #peek-open {
    position: absolute;
    z-index: 1;
    top: max(10px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    min-height: 44px;
    padding: 0 16px;
    border: 1px solid #fff5;
    border-radius: 22px;
    background: #181921;
    white-space: nowrap;
  }
  .phone:has(#peek-open:not([hidden])) {
    padding-top: calc(max(10px, env(safe-area-inset-top)) + 56px);
  }
  .sharing-notice { max-width: 30ch; text-align: center; font-size: .875rem; }
  .phone, .peek-dialog, .home-screen {
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
</style>
</head>
<body>
<main class="phone" aria-labelledby="passcode-title">
  <button id="peek-open" type="button">Sharing settings</button>
  <div class="prompt">
    <h1 id="passcode-title">Enter Passcode</h1>
    <div class="dots" aria-hidden="true">
      <span class="dot"></span><span class="dot"></span>
      <span class="dot"></span><span class="dot"></span>
    </div>
    <p class="status" role="status"></p>
  </div>
  <div class="keypad" role="group" aria-label="Passcode keypad">
    <button class="key" data-digit aria-label="1"><span class="digit">1</span></button>
    <button class="key" data-digit aria-label="2"><span class="digit">2</span><span class="letters">ABC</span></button>
    <button class="key" data-digit aria-label="3"><span class="digit">3</span><span class="letters">DEF</span></button>
    <button class="key" data-digit aria-label="4"><span class="digit">4</span><span class="letters">GHI</span></button>
    <button class="key" data-digit aria-label="5"><span class="digit">5</span><span class="letters">JKL</span></button>
    <button class="key" data-digit aria-label="6"><span class="digit">6</span><span class="letters">MNO</span></button>
    <button class="key" data-digit aria-label="7"><span class="digit">7</span><span class="letters">PQRS</span></button>
    <button class="key" data-digit aria-label="8"><span class="digit">8</span><span class="letters">TUV</span></button>
    <button class="key" data-digit aria-label="9"><span class="digit">9</span><span class="letters">WXYZ</span></button>
    <button class="key zero" data-digit aria-label="0"><span class="digit">0</span></button>
    <button class="action" id="reset">Reset</button>
    <button class="action backspace" id="backspace" aria-label="Delete last digit">⌫</button>
  </div>
  <div class="haptics-check" hidden>
    <button class="action" type="button">Test heavy haptic</button>
    <output role="status"></output>
  </div>
  <p class="sharing-notice" hidden>Demo only. Digits are sent to Phone 2. Use made-up numbers.</p>
</main>
<button class="sharing-dot" type="button" aria-label="Stop sharing demo keypad taps" hidden></button>
<dialog class="peek-dialog" aria-labelledby="peek-title">
  <h2 id="peek-title">Peek Mode</h2>
  <p>Use made-up numbers only. While sharing is on, every number pressed on Phone 1 is sent to Phone 2.</p>
  <button id="peek-host" type="button">Start sharing keypad taps</button>
  <output class="peek-status" role="status"></output>
  <output class="peek-taps" aria-label="Latest demo keypad taps"></output>
  <button id="peek-close" type="button">Close</button>
</dialog>
<section class="home-screen" aria-label="Home Screen reveal" hidden>
  <h1 class="unlocked-title">Unlocked</h1>
  <button class="home-replay" type="button">Replay</button>
</section>
<script>
  const dots = document.querySelectorAll('.dot');
  const status = document.querySelector('.status');
  const title = document.querySelector('#passcode-title');
  const phone = document.querySelector('.phone');
  const home = document.querySelector('.home-screen');
  const replay = document.querySelector('.home-replay');
  let count = 0;
  let attempts = 0;
  const unlockAttempt = 3;

  function render(message) {
    dots.forEach((dot, index) => dot.classList.toggle('filled', index < count));
    status.textContent = message;
  }

  function enterDigit() {
    if (attempts === unlockAttempt) return;
    count += 1;
    if (count < dots.length) {
      render(count + ' of ' + dots.length + ' digits entered');
      return;
    }

    attempts += 1;
    if (attempts === unlockAttempt) {
      title.textContent = 'Unlocked';
      render('Demo unlocked');
      phone.hidden = true;
      home.hidden = false;
      replay.focus({ preventScroll: true });
      return;
    }

    count = 0;
    render('Incorrect passcode. Try again.');
  }

  function backspace() {
    if (count === 0 || attempts === unlockAttempt) return;
    count -= 1;
    render(count + ' of ' + dots.length + ' digits entered');
  }

  function reset() {
    if (attempts === unlockAttempt) {
      attempts = 0;
      title.textContent = sharingDot.hidden ? 'Enter Passcode' : 'Demo keypad';
      home.hidden = true;
      phone.hidden = false;
      document.querySelector('[data-digit]').focus({ preventScroll: true });
    }
    count = 0;
    render('Passcode cleared');
  }

  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const pressAnimations = new WeakMap();
  const keypadButtons = new Map();

  let preparedAura;

  function prepareKeyHaptics() {
    const aura = window.Aura;
    if (aura === preparedAura || typeof aura?.prepareHaptics !== 'function') return;
    preparedAura = aura;
    try {
      Promise.resolve(aura.prepareHaptics()).catch(() => { preparedAura = undefined; });
    } catch {
      preparedAura = undefined;
    }
  }

  // Mirrors AuraKit.haptics.heavy() and its 30ms vibration fallback.
  async function playKeyHaptic() {
    const aura = window.Aura;
    if (typeof aura?.haptic === 'function') {
      prepareKeyHaptics();
      try {
        await aura.haptic('impact', { style: 'heavy', intensity: 1 });
        return 'Aura accepted the heavy impact. Did you feel a tap?';
      } catch (error) {
        console.warn('Aura keypad haptics unavailable:', error);
        navigator.vibrate?.(30);
        return 'Aura rejected the request. Reopen the HTTPS bookmark in Aura Browser.';
      }
    }
    return navigator.vibrate?.(30)
      ? 'Standard vibration requested. The Aura bridge is unavailable.'
      : 'Aura bridge unavailable. Bookmark this page in Aura Browser, then reopen it there.';
  }

  if (new URLSearchParams(location.search).get('haptics') === 'check') {
    const check = document.querySelector('.haptics-check');
    const output = check.querySelector('output');
    const test = check.querySelector('button');
    check.hidden = false;
    test.addEventListener('click', async () => {
      test.disabled = true;
      output.textContent = 'Requesting heavy impact…';
      try {
        output.textContent = await playKeyHaptic();
      } catch {
        output.textContent = 'Haptic request unavailable in this browser.';
      } finally {
        test.disabled = false;
      }
    });
  }

  const peek = document.querySelector('.peek-dialog');
  const peekOpen = document.querySelector('#peek-open');
  const peekHost = document.querySelector('#peek-host');
  let isAuraClip = false;
  const peekStatus = document.querySelector('.peek-status');
  const peekTaps = document.querySelector('.peek-taps');
  const sharingDot = document.querySelector('.sharing-dot');
  const sharingNotice = document.querySelector('.sharing-notice');
  const resetKey = document.querySelector('#reset');
  let link;
  let session;
  let holdTimer;
  let resetHeld = false;
  let kitLoad;

  function loadAuraKit() {
    if (!kitLoad) {
      kitLoad = import('https://cdn.jsdelivr.net/gh/splitter77/aura_framework@0d6c80d44e6a5ea886c4356119bf80313e99b517/aurakit.js')
        .then(() => window.AuraKit)
        .catch(error => { kitLoad = undefined; throw error; });
    }
    return kitLoad;
  }

  function showSharing(active) {
    sharingDot.hidden = !active;
    sharingNotice.hidden = !active;
    peekOpen.hidden = active;
    if (!phone.hidden) title.textContent = active ? 'Demo keypad' : 'Enter Passcode';
  }

  async function stopPeek() {
    const current = session;
    if (!current || current.stopping) return;
    current.stopping = true;
    showSharing(false);
    peekTaps.textContent = '';
    peekStatus.textContent = 'Sharing stopped.';
    current.off.forEach(off => off());
    try {
      if (link) await link.stop();
    } catch (error) {
      console.warn('AuraKit link stop failed:', error);
    } finally {
      session = undefined;
      peekHost.disabled = false;
    }
  }

  async function startPeek(role) {
    if (session) return;
    const current = { role, peer: undefined, off: [], stopping: false };
    session = current;
    peekHost.disabled = true;
    peekTaps.textContent = '';
    const pairing = role === 'host'
      ? 'Waiting for Phone 2 to open your AuraClip…'
      : 'Looking for Phone 1…';
    peekStatus.textContent = pairing;
    try {
      const kit = await loadAuraKit();
      const env = await kit.ready();
      if (session !== current || current.stopping) return;
      if (!env.available || env.caps?.peer === false) {
        throw new Error('Use an Aura Browser bookmark on Phone 1 and your AuraClip on Phone 2.');
      }
      if (Boolean(env.appClip) !== (role === 'guest')) {
        throw new Error('Start sharing in Aura Browser and receive taps in AuraClip.');
      }
      link ??= kit.link({ role, autoStart: false, urlParams: false, rememberRoom: false });
      current.off.push(link.on('status', (status, error) => {
        if (status === 'error' || status === 'unavailable') {
          peekStatus.textContent = pairing + ' ' + (error || 'Bluetooth is unavailable.');
        }
      }));
      current.off.push(link.onSync(({ peer }) => {
        if (typeof peer !== 'string' || !link.peers.has(peer) || current.peer) return;
        current.peer = peer;
        peekStatus.textContent = role === 'host' ? 'Sharing demo taps.' : 'Connected to Phone 1.';
        if (role === 'host') {
          showSharing(true);
          peek.close();
        }
      }));
      current.off.push(link.on('disconnect', ({ id }) => {
        if (current.peer === id) void stopPeek();
      }));
      if (role === 'guest') {
        current.off.push(link.onMessage('unlock-demo-tap', (digit, from) => {
          if (current.peer === from && typeof digit === 'string' && /^[0-9]$/.test(digit)) {
            peekTaps.textContent = (peekTaps.textContent + digit).slice(-24);
          }
        }));
      }
      await link.start();
    } catch (error) {
      if (session !== current || current.stopping) return;
      await stopPeek();
      peekStatus.textContent = error.message || 'AuraKit could not start.';
    }
  }

  function shareDemoTap(digit) {
    const current = session;
    if (!current || current.stopping || current.role !== 'host' ||
        !current.peer || sharingDot.hidden || !link.connected) return;
    link.send('unlock-demo-tap', digit, { to: current.peer }).then(sent => {
      if (!sent && session === current) void stopPeek();
    }).catch(() => {
      if (session === current) void stopPeek();
    });
  }

  function openPeek() {
    if (!peek.open && sharingDot.hidden) {
      peek.showModal();
      if (isAuraClip) void startPeek('guest');
    }
  }

  peekOpen.addEventListener('click', openPeek);
  peekHost.addEventListener('click', () => void startPeek('host'));
  document.querySelector('#peek-close').addEventListener('click', () => peek.close());
  peek.addEventListener('close', () => {
    if (sharingDot.hidden) void stopPeek();
  });
  sharingDot.addEventListener('click', () => {
    void stopPeek();
    (phone.hidden ? replay : peekOpen).focus({ preventScroll: true });
  });
  resetKey.addEventListener('pointerdown', event => {
    if (event.button !== 0) return;
    resetHeld = false;
    holdTimer = setTimeout(() => {
      resetHeld = sharingDot.hidden;
      if (resetHeld) openPeek();
    }, 650);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(type => {
    resetKey.addEventListener(type, () => clearTimeout(holdTimer));
  });
  resetKey.addEventListener('contextmenu', event => event.preventDefault());

  function bindKey(button, key, action) {
    keypadButtons.set(key, button);
    const light = document.createElement('span');
    light.className = 'key-light';
    light.setAttribute('aria-hidden', 'true');
    button.append(light);
    let lightAnimation;

    button.addEventListener('pointerdown', event => {
      prepareKeyHaptics();
      pressAnimations.get(button)?.cancel();
      lightAnimation?.cancel();
      const bounds = button.getBoundingClientRect();
      light.style.setProperty('--light-x', (event.clientX - bounds.left) / bounds.width * 100 + '%');
      light.style.setProperty('--light-y', (event.clientY - bounds.top) / bounds.height * 100 + '%');
    });
    button.addEventListener('click', event => {
      playKeyHaptic();
      action();
      if (event.detail !== 0) return;
      lightAnimation?.cancel();
      light.style.removeProperty('--light-x');
      light.style.removeProperty('--light-y');
      lightAnimation = light.animate([{ opacity: 1 }, { opacity: 0 }], {
        duration: reducedMotion.matches ? 90 : 300,
        easing: 'ease-out'
      });
      pressAnimations.get(button)?.cancel();
      const pressed = { backgroundColor: button.matches('.key') ? '#ffffff59' : '#ffffff26' };
      const style = getComputedStyle(button);
      const released = { backgroundColor: style.backgroundColor };
      if (!reducedMotion.matches) {
        pressed.transform = 'scale(.88)';
        released.transform = 'scale(1)';
      }
      pressAnimations.set(button, button.animate([pressed, released], {
        duration: reducedMotion.matches ? 90 : 380,
        easing: reducedMotion.matches ? 'ease-out' : style.getPropertyValue('--key-release-easing').trim()
      }));
    });
  }

  document.querySelectorAll('[data-digit]').forEach(button => {
    const digit = button.getAttribute('aria-label');
    bindKey(button, digit, () => {
      shareDemoTap(digit);
      enterDigit();
    });
  });
  bindKey(document.querySelector('#backspace'), 'Backspace', backspace);
  resetKey.addEventListener('click', event => {
    if (!resetHeld || event.detail === 0) return;
    resetHeld = false;
    event.stopImmediatePropagation();
  });
  bindKey(resetKey, 'Escape', reset);
  replay.addEventListener('click', reset);
  document.addEventListener('keydown', event => {
    if (peek.open || event.altKey || event.ctrlKey || event.metaKey) return;
    if (!home.hidden) {
      if (event.key === 'Escape') reset();
      return;
    }
    const button = keypadButtons.get(event.key);
    if (!button) return;
    event.preventDefault();
    button.click();
  });
  if (window.Aura) {
    loadAuraKit().then(kit => kit.ready()).then(env => {
      if (!env.available || !env.appClip) return;
      isAuraClip = true;
      peekHost.hidden = true;
      peekOpen.textContent = 'Open Peek Mode';
      if (peek.open) void startPeek('guest');
      else openPeek();
    }).catch(error => console.warn('AuraKit automatic connection unavailable:', error));
  }
</script>
</body>
</html>
